name: Check pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: review-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: sublist-review
          NEXT_PUBLIC_FIREBASE_APP_ID: review
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: sublist-review.firebaseapp.com
